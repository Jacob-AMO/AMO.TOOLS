<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMO Tools — Offshore Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#05322b;
    --panel:#0b433a;
    --panel-raised:#0f5245;
    --line:#1e6b58;
    --text:#eaf5f1;
    --muted:#9fc4b8;
    --teal:#02bc94;
    --teal-dim:#018374;
    --amber:#e6a53c;
    --rust:#d6603f;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body{padding-bottom:78px;}
  h1,h2,h3{font-family:'Big Shoulders Display',sans-serif; font-weight:800; margin:0; letter-spacing:.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  /* Top bar */
  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,#0a4739 0%, #05322bee 100%);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .brand-row{display:flex; align-items:baseline; justify-content:space-between;}
  .brand{font-size:26px; text-transform:uppercase; line-height:1;}
  .brand small{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:.18em; color:var(--muted); font-weight:500; margin-top:3px;}
  .vessel-picker{display:flex; gap:6px; margin-top:12px;}
  .vessel-picker button{
    flex:1; padding:8px 4px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:.05em; font-weight:600;
  }
  .vessel-picker button.active{background:var(--teal-dim); border-color:var(--teal); color:#eafff9;}

  main{padding:14px 14px 8px; max-width:640px; margin:0 auto;}
  .section-title{display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px;}
  .section-title h2{font-size:19px; text-transform:uppercase;}
  .section-title .count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}

  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px;
  }
  .searchbar input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px;}
  .searchbar input::placeholder{color:var(--muted);}

  .subtabs{display:flex; gap:8px; margin-top:12px;}
  .subtabs button{
    padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:transparent;
    color:var(--muted); font-size:13px; font-weight:600;
  }
  .subtabs button.active{background:var(--teal); border-color:var(--teal); color:#0b1512;}

  /* Stock gauge card */
  .item-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
  }
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .item-name{font-size:15px; font-weight:600;}
  .item-sub{font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
  .item-qty{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; text-align:right; white-space:nowrap;}
  .item-qty span{font-size:11px; color:var(--muted); font-weight:400;}
  .gauge{height:6px; border-radius:4px; background:#04241e; margin-top:10px; overflow:hidden; border:1px solid var(--line);}
  .gauge i{display:block; height:100%; background:linear-gradient(90deg,var(--teal-dim),var(--teal));}
  .gauge.low i{background:linear-gradient(90deg,#8a5a1f,var(--amber));}
  .gauge.zero i{background:var(--rust);}
  .item-actions{display:flex; gap:8px; margin-top:10px;}
  .item-actions button{
    flex:1; padding:8px 0; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-raised); color:var(--text); font-size:13px; font-weight:600;
  }
  .item-actions button.use{color:var(--rust); border-color:#4a2a22;}
  .item-actions button.fill{color:var(--teal); border-color:#20463f;}

  /* Generic list rows (battery / orders / crew) */
  .row-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
  }
  .row-top{display:flex; justify-content:space-between; gap:10px;}
  .row-title{font-size:15px; font-weight:600;}
  .row-meta{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5;}
  .badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; height:fit-content;
  }
  .badge.pending{background:#402f14; color:var(--amber);}
  .badge.ordered{background:#173a44; color:#6fc4d8;}
  .badge.received{background:#173a26; color:#5fcf8e;}

  .crew-date{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--amber);
    margin:18px 2px 6px; letter-spacing:.06em;}
  .crew-team{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;}

  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px;}
  .empty b{display:block; color:var(--text); font-family:'Big Shoulders Display'; font-size:20px; margin-bottom:6px;}

  /* Bottom nav */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:#0a4739ee; backdrop-filter:blur(8px); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--muted); padding:8px 2px 4px;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px;
    font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  }
  nav.bottom button .dot{width:5px; height:5px; border-radius:50%; background:transparent;}
  nav.bottom button.active{color:var(--teal);}
  nav.bottom button.active .dot{background:var(--teal);}

  /* FAB */
  .fab{
    position:fixed; right:18px; bottom:78px; z-index:25;
    width:54px; height:54px; border-radius:50%; border:none;
    background:var(--teal); color:#08211c; font-size:30px; font-weight:400;
    box-shadow:0 8px 20px #0006; padding:0;
    display:flex; align-items:center; justify-content:center;
    font-family:Arial,sans-serif;
  }
  .fab span{display:block; transform:translateY(-1px);}

  /* Sheet / modal */
  .overlay{position:fixed; inset:0; background:#000a; z-index:40; display:none;}
  .overlay.show{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-height:88vh; overflow-y:auto;
    background:var(--panel); border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom)); transform:translateY(100%);
    transition:transform .25s ease;
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet h3{font-size:20px; text-transform:uppercase; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-raised); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; color:var(--text); font-size:15px; font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .sign-toggle{display:flex; gap:8px;}
  .sign-toggle button{flex:1; padding:11px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-raised); color:var(--muted); font-weight:700;}
  .sign-toggle button.sel-fill{background:var(--teal-dim); border-color:var(--teal); color:#eafff9;}
  .sign-toggle button.sel-use{background:#4a2a22; border-color:var(--rust); color:#ffe4dc;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; padding:13px 0; border-radius:11px; border:none; font-weight:700; font-size:14px;}
  .btn-cancel{background:var(--panel-raised); color:var(--muted); border:1px solid var(--line) !important;}
  .btn-save{background:var(--teal); color:#08211c;}

  .config-banner{
    background:#402f14; border:1px solid #6b4f1f; color:var(--amber); font-size:12.5px;
    padding:10px 14px; border-radius:12px; margin-bottom:14px; line-height:1.5;
  }
  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%); z-index:50;
    background:#1e2a30; border:1px solid var(--line); color:var(--text); padding:10px 18px;
    border-radius:30px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* Login screen */
  #loginScreen{
    position:fixed; inset:0; z-index:60; background:var(--bg);
    display:flex; flex-direction:column; justify-content:center; padding:24px;
  }
  .login-box{max-width:360px; margin:0 auto; width:100%;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .pw-toggle{position:absolute; right:4px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:18px; padding:8px; line-height:1;}
  .login-brand{text-align:center; margin-bottom:28px;}
  .login-brand h1{font-size:34px; text-transform:uppercase;}
  .login-brand small{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.18em; color:var(--muted); margin-top:4px;}
  .login-error{background:#402014; border:1px solid #6b2f1f; color:var(--rust); font-size:13px;
    padding:9px 12px; border-radius:10px; margin-bottom:14px; display:none;}
  .login-error.show{display:block;}
  #btnLogin{width:100%; padding:13px 0; border-radius:11px; border:none; background:var(--teal);
    color:#08211c; font-weight:700; font-size:15px; margin-top:6px;}
  #btnLogin:disabled{opacity:.6;}
  .login-hint{text-align:center; color:var(--muted); font-size:12px; margin-top:18px; line-height:1.5;}

  /* Logout in header */
  .signout{background:none; border:1px solid var(--line); color:var(--muted); border-radius:9px;
    padding:6px 10px; font-size:11px; font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-brand">
      <h1>AMO Tools</h1>
      <small>OFFSHORE STOCK &amp; ASSET TRACKING</small>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label>
      <div class="pw-wrap"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
      <button type="button" class="pw-toggle" id="pwToggle">👁</button></div></div>
    <button id="btnLogin">Sign in</button>
    <div class="login-hint">No personal account? Ask your admin for the shared guest login.</div>
  </div>
</div>

<header class="top" id="appHeader" style="display:none;">
  <div class="brand-row">
    <h1 class="brand">AMO Tools<small>OFFSHORE STOCK &amp; ASSET TRACKING</small></h1>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="signout" id="btnActivity" style="display:none;">👥 Activity</button>
      <button class="signout" id="btnLogout">Sign out</button>
    </div>
  </div>
  <div id="whoAmI" style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-top:8px;"></div>
  <div class="vessel-picker" id="vesselPicker"></div>
</header>

<main id="main" style="display:none;"></main>

<button class="fab" id="fab" style="display:none;"><span>+</span></button>

<nav class="bottom" id="bottomNav" style="display:none;">
  <button data-tab="stock"><span>⛽</span>Stock<span class="dot"></span></button>
  <button data-tab="battery"><span>🔋</span>Batteries<span class="dot"></span></button>
  <button data-tab="crew"><span>👷</span>Crew<span class="dot"></span></button>
  <button data-tab="orders"><span>📦</span>Orders<span class="dot"></span></button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1) CONFIG — enter your Supabase credentials (Project Settings -> API)
   ============================================================ */
const SUPABASE_URL = 'https://xgiccxycszgofpvrahuu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnaWNjeHljc3pnb2ZwdnJhaHV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NjAxMjksImV4cCI6MjEwMzUzNjEyOX0.wayH2lNsl3pe4JNEIgbDTUds_PAXtP7hBXy20xD5Xpk';

const configured = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============================================================
   1b) AUTH — sign-in gate. Accounts are created by an admin in
   Supabase (Authentication -> Users -> Add user), not self-signup.
   ============================================================ */
const $loginScreen = document.getElementById('loginScreen');
const $appHeader = document.getElementById('appHeader');
const $loginError = document.getElementById('loginError');

function showLogin(){
  $loginScreen.style.display='flex';
  $appHeader.style.display='none';
  document.getElementById('main').style.display='none';
  document.getElementById('fab').style.display='none';
  document.getElementById('bottomNav').style.display='none';
}
function showApp(){
  $loginScreen.style.display='none';
  $appHeader.style.display='block';
  document.getElementById('main').style.display='block';
  document.getElementById('fab').style.display='flex';
  document.getElementById('bottomNav').style.display='flex';
}
/* ---- Login lockout after repeated failed attempts ---- */
const LOCKOUT_KEY = 'amo_login_attempts';
const MAX_ATTEMPTS = 3;
const LOCKOUT_MINUTES = 5;
function getLockoutState(){
  try{ return JSON.parse(localStorage.getItem(LOCKOUT_KEY)) || {count:0, lockUntil:0}; }
  catch(e){ return {count:0, lockUntil:0}; }
}
function setLockoutState(s){
  try{ localStorage.setItem(LOCKOUT_KEY, JSON.stringify(s)); }catch(e){}
}
function recordFailedLogin(){
  const s = getLockoutState();
  s.count = (s.count||0) + 1;
  if(s.count >= MAX_ATTEMPTS){ s.lockUntil = Date.now() + LOCKOUT_MINUTES*60000; s.count = 0; }
  setLockoutState(s);
}
function clearLockout(){ setLockoutState({count:0, lockUntil:0}); }
function lockoutMinutesLeft(){
  const s = getLockoutState();
  if(!s.lockUntil || s.lockUntil <= Date.now()) return 0;
  return Math.ceil((s.lockUntil - Date.now())/60000);
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('btnLogin');
  $loginError.classList.remove('show');
  const minsLeft = lockoutMinutesLeft();
  if(minsLeft > 0){
    $loginError.textContent = `Too many failed attempts. Try again in ${minsLeft} minute${minsLeft>1?'s':''}.`;
    $loginError.classList.add('show'); return;
  }
  if(!email || !password){ $loginError.textContent='Enter email and password.'; $loginError.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  const {error} = await sb.auth.signInWithPassword({email, password});
  btn.disabled = false; btn.textContent = 'Sign in';
  if(error){
    recordFailedLogin();
    const nowLocked = lockoutMinutesLeft();
    $loginError.textContent = nowLocked > 0
      ? `Too many failed attempts. Try again in ${nowLocked} minute${nowLocked>1?'s':''}.`
      : 'Incorrect email or password.';
    $loginError.classList.add('show');
  } else {
    clearLockout();
  }
}
async function checkAdmin(){
  const {data} = await sb.from('admins').select('user_id');
  isAdmin = !!(data && data.length);
}
let profileMap = {}; // user_id -> display label
let currentUserId = null;
let myRole = 'employee';
let isGuest = false;
async function loadProfiles(){
  const {data, error} = await sb.from('profiles').select('id, email, display_name, role');
  if(error){ console.error(error); return; }
  profileMap = {};
  (data||[]).forEach(p=>{ profileMap[p.id] = p.display_name || p.email || p.id; });
  const mine = (data||[]).find(p=>p.id===currentUserId);
  myRole = (mine && mine.role) || 'employee';
  isGuest = myRole === 'guest';
}
function esc(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function whoLabel(userId){
  if(!userId) return '—';
  return esc(profileMap[userId] || 'Unknown user');
}

/* ---- Session tracking (who's logged in, when, for how long) ---- */
let currentSessionId = null;
let heartbeatTimer = null;
async function startSessionTracking(){
  if(currentSessionId) return; // already tracking this browser session
  const {data, error} = await sb.from('login_sessions').insert({user_id: currentUserId}).select().single();
  if(error){ console.error('session log failed', error); return; }
  currentSessionId = data.id;
  heartbeatTimer = setInterval(async ()=>{
    if(!currentSessionId) return;
    await sb.from('login_sessions').update({last_seen_at:new Date().toISOString()}).eq('id', currentSessionId);
  }, 180000); // heartbeat every 3 minutes
}
async function endSessionTracking(){
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; }
  if(currentSessionId){
    await sb.from('login_sessions').update({logout_at:new Date().toISOString(), last_seen_at:new Date().toISOString()}).eq('id', currentSessionId);
    currentSessionId = null;
  }
}

/* ---- Auto sign-out after 15 minutes of inactivity ---- */
const INACTIVITY_LIMIT_MS = 15*60000;
let inactivityTimer = null;
function resetInactivityTimer(){
  if(!currentUserId) return; // not logged in, nothing to do
  if(inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(async ()=>{
    await endSessionTracking();
    await sb.auth.signOut();
    $loginError.textContent = 'Signed out after 15 minutes of inactivity.';
    $loginError.classList.add('show');
  }, INACTIVITY_LIMIT_MS);
}
function stopInactivityTimer(){
  if(inactivityTimer){ clearTimeout(inactivityTimer); inactivityTimer=null; }
}
['click','keydown','touchstart','mousemove','scroll'].forEach(evt=>
  window.addEventListener(evt, ()=>{ if(currentUserId) resetInactivityTimer(); }, {passive:true}));

function fmtDuration(ms){
  if(ms<0) ms=0;
  const mins = Math.round(ms/60000);
  if(mins<1) return '<1m';
  if(mins<60) return mins+'m';
  const h = Math.floor(mins/60), m = mins%60;
  return h+'h '+m+'m';
}
async function openActivityLog(){
  openSheet(`<h3>Activity Log</h3><div id="actList" class="field"><div class="empty">Loading...</div></div>
    <div class="sheet-actions"><button class="btn-cancel" id="cancel" style="flex:1;">Close</button></div>`);
  document.getElementById('cancel').onclick = closeSheet;
  const {data, error} = await sb.from('login_sessions').select('*')
    .order('login_at', {ascending:false}).limit(80);
  const box = document.getElementById('actList');
  if(error){ box.innerHTML = 'Failed to load activity.'; console.error(error); return; }
  if(!data.length){ box.innerHTML = '<div class="empty">No activity yet.</div>'; return; }

  // Last seen summary per user
  const lastByUser = {};
  data.forEach(s=>{
    const t = s.logout_at || s.last_seen_at || s.login_at;
    if(!lastByUser[s.user_id] || new Date(t) > new Date(lastByUser[s.user_id].t)){
      lastByUser[s.user_id] = {t, online: !s.logout_at && (Date.now()-new Date(s.last_seen_at).getTime()) < 5*60000};
    }
  });
  const summaryHtml = Object.keys(lastByUser).map(uid=>{
    const info = lastByUser[uid];
    return `<div class="row-card" style="margin-bottom:8px;">
      <div class="row-top"><div class="row-title">${whoLabel(uid)}</div>
      ${info.online ? '<span class="badge received">🟢 Online</span>' : ''}</div>
      <div class="row-meta">Last seen: ${new Date(info.t).toLocaleString()}</div>
    </div>`;
  }).join('');

  const historyHtml = data.map(s=>{
    const start = new Date(s.login_at);
    const end = s.logout_at ? new Date(s.logout_at) : new Date(s.last_seen_at);
    const dur = fmtDuration(end - start);
    const stillOpen = !s.logout_at && (Date.now()-new Date(s.last_seen_at).getTime()) < 5*60000;
    return `<div class="row-card" style="margin-bottom:8px;">
      <div class="row-top"><div class="row-title">${whoLabel(s.user_id)}</div>
      ${stillOpen ? '<span class="badge received">🟢</span>' : ''}</div>
      <div class="row-meta">${start.toLocaleString()} · duration: ${dur}${stillOpen? ' (ongoing)':''}</div>
    </div>`;
  }).join('');

  box.innerHTML = `<div class="section-title" style="margin-top:0;"><h2 style="font-size:15px;">Last seen — by user</h2></div>
    ${summaryHtml}
    <div class="section-title"><h2 style="font-size:15px;">Recent sessions</h2></div>
    ${historyHtml}`;
}

async function initAuth(){
  if(!configured) return; // config banner in render() already covers this case
  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('pwToggle').addEventListener('click', ()=>{
    const f = document.getElementById('loginPassword');
    f.type = f.type==='password' ? 'text' : 'password';
  });
  document.getElementById('btnLogout').addEventListener('click', async ()=>{ stopInactivityTimer(); await endSessionTracking(); await sb.auth.signOut(); });
  document.getElementById('btnActivity').addEventListener('click', openActivityLog);
  sb.auth.onAuthStateChange(async (_event, session)=>{
    if(session){ currentUserId=session.user.id; await checkAdmin(); await loadProfiles(); await startSessionTracking(); resetInactivityTimer(); showApp(); render(); }
    else { isAdmin=false; isGuest=false; currentUserId=null; stopInactivityTimer(); showLogin(); }
  });
  const {data:{session}} = await sb.auth.getSession();
  if(session){ currentUserId=session.user.id; await checkAdmin(); await loadProfiles(); await startSessionTracking(); resetInactivityTimer(); showApp(); render(); } else { showLogin(); }
}

async function render(){

    b.classList.toggle('active', b.dataset.tab===state.tab));

    b.classList.toggle('active', b.dataset.v===state.vessel));

async function renderStock(){
  $main.innerHTML = `<div class="subtabs">
      <button data-c="oil" class="${state.stockCat==='oil'?'active':''}">Oil</button>
      <button data-c="filter" class="${state.stockCat==='filter'?'active':''}">Filters</button>
    </div>

    <div class="searchbar"><span>🔎</span><input id="q" placeholder="Search by name..." value="${state.search}"></div>
    <div class="section-title"><h2>${state.vessel} Offshore Stock · ${state.stockCat==='oil'?'Oil':'Filters'}</h2>
      <span class="count" id="cnt"></span></div>
    <div id="list"><div class="empty">Loading...</div></div>`;

  $main.querySelector('.subtabs').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return; state.stockCat=b.dataset.c; render();
  });
  $main.querySelector('#q').addEventListener('input', e=>{ state.search=e.target.value; filterAndPaintStock(); });

  state.data.stock = await fetchStock();
  filterAndPaintStock();

function filterAndPaintStock(){
  const items = (state.data.stock||[]).filter(i=>
    i.name.toLowerCase().includes(state.search.toLowerCase()));
  document.getElementById('cnt').textContent = items.length + ' items';
  const list = document.getElementById('list');
  if(!items.length){ list.innerHTML = `<div class="empty"><b>Empty</b>Nothing found.${isGuest?'':' Add an item with the "+" button.'}</div>`; return; }
  const maxQty = Math.max(...items.map(i=>Math.max(i.current_qty, i.low_stock_threshold||0, 1)));
  list.innerHTML = items.map(i=>{
    const pct = Math.max(0, Math.min(100, (i.current_qty/maxQty)*100));
    const isZero = i.current_qty<=0;
    const isLow = !isZero && i.low_stock_threshold && i.current_qty<=i.low_stock_threshold;
    const gclass = isZero ? 'zero' : (isLow ? 'low' : '');
    const statusBadge = isZero ? '<span class="badge pending" style="background:#4a2a22;color:var(--rust);">OUT OF STOCK</span>'
      : (isLow ? '<span class="badge pending">LOW STOCK</span>' : '');
    const minLine = i.low_stock_threshold ? ` · min ${fmtNum(i.low_stock_threshold)} ${i.unit}` : '';
    const notesLine = i.notes ? `<div class="item-sub" style="margin-top:4px;font-style:italic;">📝 ${esc(i.notes)}</div>` : '';
    const actionButtons = isGuest ? '' : `
        <button class="use" data-id="${i.item_id}" data-name="${esc(i.name)}" data-unit="${esc(i.unit)}" data-mode="use">− Use</button>
        <button class="fill" data-id="${i.item_id}" data-name="${esc(i.name)}" data-unit="${esc(i.unit)}" data-mode="fill">+ Refill</button>`;
    const minButton = isGuest ? '' : `<button class="setmin" data-id="${i.item_id}" data-name="${esc(i.name)}" data-unit="${esc(i.unit)}" data-min="${i.low_stock_threshold||0}" data-notes="${esc(i.notes)}" style="flex:.6;">⚙ Info</button>`;
    return `<div class="item-card">
      <div class="item-top">
        <div><div class="item-name">${esc(i.name)}</div><div class="item-sub">${esc(i.vessel)} · ${esc(i.category)}${minLine}</div>${notesLine}</div>
        <div style="text-align:right;">
          <div class="item-qty">${fmtNum(i.current_qty)} <span>${i.unit}</span></div>
          ${statusBadge}
        </div>
      </div>
      <div class="gauge ${gclass}"><i style="width:${pct}%"></i></div>
      <div class="item-actions">${actionButtons}
        <button class="hist" data-id="${i.item_id}" data-name="${esc(i.name)}" data-unit="${esc(i.unit)}" style="flex:.7;">📜 Log</button>
        ${minButton}
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.item-actions .use, .item-actions .fill').forEach(b=>
    b.addEventListener('click', ()=>openStockTxnForm(b.dataset.id, b.dataset.name, b.dataset.unit, b.dataset.mode)));
  list.querySelectorAll('.item-actions .hist').forEach(b=>
    b.addEventListener('click', ()=>openStockHistory(b.dataset.id, b.dataset.name, b.dataset.unit)));
  list.querySelectorAll('.item-actions .setmin').forEach(b=>
    b.addEventListener('click', ()=>openStockMinForm(b.dataset.id, b.dataset.name, b.dataset.unit, b.dataset.min, b.dataset.notes)));
}
function fmtNum(n){ return Number(n).toLocaleString('ru-RU', {maximumFractionDigits:2}); }

   6) FORMS (bottom sheets)

function openStockForm(){
  openSheet(`<h3>New Stock Item</h3>
    <div class="field"><label>Vessel</label>
      <select id="f_vessel">${VESSELS.map(v=>`<option ${v===state.vessel?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>Category</label>
      <select id="f_cat"><option value="oil" ${state.stockCat==='oil'?'selected':''}>Oil</option>
        <option value="filter" ${state.stockCat==='filter'?'selected':''}>Filter</option></select></div>
    <div class="field"><label>Name / part number</label><input id="f_name" placeholder="e.g. LF691 or Engine Oil 15w40"></div>
    <div class="field"><label>Unit</label><input id="f_unit" placeholder="ea or lit" value="${state.stockCat==='oil'?'lit':'ea'}"></div>
    <div class="field"><label>Initial quantity</label><input id="f_qty" type="number" step="any" value="0"></div>
    <div class="field"><label>Minimum / reorder level (optional)</label><input id="f_min" type="number" step="any" value="0"></div>
    <div class="field"><label>Comments (equipment, analog part numbers — optional)</label><textarea id="f_notes" placeholder="e.g. Used on Power Pack CT-1; analog: Fleetguard LF691"></textarea></div>
    <div class="sheet-actions"><button class="btn-cancel" id="cancel">Cancel</button>
      <button class="btn-save" id="save">Add</button></div>`);
  document.getElementById('cancel').onclick = closeSheet;
  document.getElementById('save').onclick = async ()=>{
    const vessel=document.getElementById('f_vessel').value, category=document.getElementById('f_cat').value;
    const name=document.getElementById('f_name').value.trim();
    const unit=document.getElementById('f_unit').value.trim()||'ea';
    const qty=parseFloat(document.getElementById('f_qty').value)||0;
    const minLevel=parseFloat(document.getElementById('f_min').value)||0;
    const notes=document.getElementById('f_notes').value.trim();
    if(!name){ toast('Enter a name'); return; }
    const {data:item, error} = await sb.from('stock_items').insert({vessel,category,name,unit,low_stock_threshold:minLevel,notes}).select().single();
    if(error){ toast('Error: item may already exist'); console.error(error); return; }
    if(qty!==0){
      await sb.from('stock_transactions').insert({item_id:item.id, quantity:qty, reason:'Initial quantity'});
    }
    closeSheet(); toast('Item added'); state.vessel=vessel; state.stockCat=category; render();
  };
}
function openStockTxnForm(itemId, name, unit, mode){
  openSheet(`<h3>${name}</h3>
    <div class="sign-toggle">
      <button id="m_fill" class="${mode==='fill'?'sel-fill':''}">+ Refill</button>
      <button id="m_use" class="${mode==='use'?'sel-use':''}">− Use</button>
    </div>
    <div class="field" style="margin-top:14px;"><label>Quantity (${unit})</label><input id="f_qty" type="number" step="any" placeholder="0"></div>
    <div class="field"><label>Date</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Technician</label><input id="f_tech" placeholder="Name"></div>
    <div class="field"><label>Equipment / Asset #</label><input id="f_equip" placeholder="e.g. Power Pack / PPJ81515"></div>
    <div class="field"><label>Reason</label><input id="f_reason" placeholder="e.g. Engine Oil change service"></div>
    <div class="sheet-actions"><button class="btn-cancel" id="cancel">Cancel</button>
      <button class="btn-save" id="save">Save</button></div>`);
  let curMode = mode;
  document.getElementById('m_fill').onclick = ()=>{ curMode='fill';
    document.getElementById('m_fill').className='sel-fill'; document.getElementById('m_use').className=''; };
  document.getElementById('m_use').onclick = ()=>{ curMode='use';
    document.getElementById('m_use').className='sel-use'; document.getElementById('m_fill').className=''; };
  document.getElementById('cancel').onclick = closeSheet;
  document.getElementById('save').onclick = async ()=>{
    let qty = parseFloat(document.getElementById('f_qty').value);
    if(!qty){ toast('Enter a quantity'); return; }
    qty = curMode==='use' ? -Math.abs(qty) : Math.abs(qty);
    const {error} = await sb.from('stock_transactions').insert({
      item_id: itemId, quantity: qty, txn_date: document.getElementById('f_date').value,
      tech: document.getElementById('f_tech').value, equipment: document.getElementById('f_equip').value,
      reason: document.getElementById('f_reason').value
    });
    if(error){ toast('Save failed'); console.error(error); return; }
    closeSheet(); toast('Saved'); renderStock();
  };
}
function openStockMinForm(itemId, name, unit, currentMin, currentNotes){
  openSheet(`<h3>${esc(name)} — Item Info</h3>
    <div class="field"><label>Minimum / reorder level (${esc(unit)})</label>
      <input id="f_min" type="number" step="any" value="${currentMin||0}"></div>
    <div class="field"><label>Comments (equipment it's used on, analog part numbers, etc.)</label>
      <textarea id="f_notes" placeholder="e.g. Used on Power Pack CT-1; analog: Fleetguard LF691">${esc(currentNotes)}</textarea></div>
    <div class="login-hint" style="text-align:left;margin-top:0;">When stock falls to or below the minimum, it's flagged as LOW STOCK on the list. Set to 0 to turn off the warning.</div>
    <div class="sheet-actions"><button class="btn-cancel" id="cancel">Cancel</button>
      <button class="btn-save" id="save">Save</button></div>`);
  document.getElementById('cancel').onclick = closeSheet;
  document.getElementById('save').onclick = async ()=>{
    const min = parseFloat(document.getElementById('f_min').value) || 0;
    const notes = document.getElementById('f_notes').value.trim();
    const {error} = await sb.from('stock_items').update({low_stock_threshold:min, notes}).eq('id', itemId);
    if(error){ toast('Save failed'); console.error(error); return; }
    closeSheet(); toast('Item updated'); renderStock();
  };
}

      </div></div>`;

function openBatteryForm(existing){
  const isEdit = !!existing;
  openSheet(`<h3>${isEdit ? 'Update Battery' : 'New Battery'}</h3>
    <div class="field"><label>Asset</label><input id="f_asset" placeholder="e.g. Power Pack PPJ81515" value="${isEdit?esc(existing.asset):''}"></div>
    <div class="field"><label>Battery data</label><input id="f_data" placeholder="12V, 62A/h, 540A, Yuasa" value="${isEdit?esc(existing.battery_data):''}"></div>
    <div class="field"><label>Qty</label><input id="f_qty" type="number" value="${isEdit?(existing.qty??1):1}"></div>
    <div class="field"><label>Changed date</label><input id="f_date" type="date" value="${isEdit?(existing.changed_date||''):''}"></div>
    <div class="field"><label>Comments</label><input id="f_comments" value="${isEdit?esc(existing.comments):''}"></div>
    <div class="sheet-actions">
      ${isEdit ? '<button class="btn-cancel" id="del" style="color:var(--rust);border-color:#4a2a22 !important;">Delete</button>' : '<button class="btn-cancel" id="cancel">Cancel</button>'}
      <button class="btn-save" id="save">${isEdit ? 'Save changes' : 'Add'}</button></div>
    ${isEdit ? '<button class="btn-cancel" id="cancel2" style="width:100%;margin-top:10px;">Cancel</button>' : ''}`);
  if(document.getElementById('cancel')) document.getElementById('cancel').onclick = closeSheet;
  if(document.getElementById('cancel2')) document.getElementById('cancel2').onclick = closeSheet;
  if(isEdit && document.getElementById('del')){
    document.getElementById('del').onclick = async ()=>{
      if(!confirm('Delete this battery record?')) return;
      const {error} = await sb.from('battery_tracking').delete().eq('id', existing.id);
      if(error){ toast('Delete failed'); console.error(error); return; }
      closeSheet(); toast('Deleted'); renderBattery();
    };
  }
  document.getElementById('save').onclick = async ()=>{
    const asset=document.getElementById('f_asset').value.trim();
    if(!asset){ toast('Enter an asset'); return; }
    const payload = {
      asset, battery_data:document.getElementById('f_data').value,
      qty:parseInt(document.getElementById('f_qty').value)||null,
      changed_date:document.getElementById('f_date').value||null,
      comments:document.getElementById('f_comments').value
    };
    let error;
    if(isEdit){
      payload.updated_at = new Date().toISOString();
      payload.updated_by = currentUserId;
      ({error} = await sb.from('battery_tracking').update(payload).eq('id', existing.id));
    } else {
      ({error} = await sb.from('battery_tracking').insert(payload));
    }
    if(error){ toast('Save failed'); console.error(error); return; }
    closeSheet(); toast(isEdit ? 'Updated' : 'Added'); renderBattery();
  };
}

function openOrderForm(existing){

      <button class="btn-save" id="save">${isEdit?'Save changes':'Add'}</button></div>

  if(document.getElementById('cancel')) document.getElementById('cancel').onclick = closeSheet;
  if(document.getElementById('cancel2')) document.getElementById('cancel2').onclick = closeSheet;

    closeSheet(); toast(isEdit?'Updated':'Order added'); renderOrders();

}
